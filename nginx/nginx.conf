# Reverse proxy: HTTPS termination, web UI and API.
# Certificates: /etc/nginx/certs/server.crt and server.key. A self-signed
# pair is generated on first start when none is present (see 10-certs.sh);
# replace them with your own certificate to remove the browser warning.

server_tokens off;

# Resolve service names at request time (Docker DNS): containers get new IPs
# when they are recreated, and nginx must not keep a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 1m;

gzip on;
gzip_types application/json application/javascript text/css image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # replaces any client-supplied value (login throttling, sign-in log)
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        set $ui_upstream http://frontend:80;
        proxy_pass $ui_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
