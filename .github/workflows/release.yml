name: Release

# Pushing a tag such as v0.14.0:
#  - builds multi-arch images and publishes them to GitHub Container Registry:
#    ghcr.io/<owner>/sflow-analytics-<service>:<version>
#  - builds the offline installation package (amd64, images included) and the VMware
#    appliance (OVA), and attaches them to a GitHub Release with the CHANGELOG section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { service: collector, context: collector, target: "" }
          - { service: api, context: api, target: runtime }
          - { service: frontend, context: frontend, target: runtime }
          - { service: nginx, context: nginx, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/sflow-analytics-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline package
        run: |
          echo "CLICKHOUSE_PASSWORD=unused" > .env
          scripts/build-package.sh "${GITHUB_REF_NAME#v}"
      - name: Build the VMware appliance (OVA)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libguestfs-tools qemu-utils >/dev/null
          sudo chmod 0644 /boot/vmlinuz-*   # libguestfs reads the host kernel
          WORK="$RUNNER_TEMP/ova" OUT=dist appliance/build-ova.sh "dist/sflow-analytics-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## [$v]" 'index($0, v) == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '    tar xzf sflow-analytics-*.tar.gz && cd sflow-analytics-*/ && sudo ./install.sh'
            echo
            echo "Ubuntu 22.04/24.04 or Debian 12, x86_64. See QUICKSTART.md in the package."
            echo
            echo "VMware appliance: deploy the .ova (ESXi 6.7+), then open the VM console."
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --title "sFlow Analytics ${GITHUB_REF_NAME#v}"
          --notes-file notes.md dist/sflow-analytics-*.tar.gz dist/sflow-analytics-*.tar.gz.sha256 dist/sflow-analytics-*.ova dist/sflow-analytics-*.ova.sha256
