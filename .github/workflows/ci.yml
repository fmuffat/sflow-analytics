name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner

  collector:
    name: Collector (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go vet -tags integration ./tests/integration
      - run: go test -race -count=1 ./...
      - name: Fuzz smoke test
        run: go test ./internal/decoder -run='^$' -fuzz=FuzzDecode -fuzztime=20s

  collector-integration:
    name: Collector ↔ ClickHouse
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: sflow
          CLICKHOUSE_PASSWORD: ci-password
        ports: ["9000:9000", "8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user sflow --password ci-password --query 'SELECT 1'"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - name: Integration tests
        working-directory: collector
        env:
          SFLOW_IT_CLICKHOUSE_ADDR: 127.0.0.1:9000
          SFLOW_IT_CLICKHOUSE_USER: sflow
          SFLOW_IT_CLICKHOUSE_PASSWORD: ci-password
        run: go test -tags integration -count=1 -v ./tests/integration

  api:
    name: API (Python)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: sflow
          CLICKHOUSE_PASSWORD: ci-password
        ports: ["8123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user sflow --password ci-password --query 'SELECT 1'"
          --health-interval 5s --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (unit + ClickHouse)
        env:
          SFLOW_TEST_CLICKHOUSE_HOST: 127.0.0.1
          SFLOW_TEST_CLICKHOUSE_PORT: "8123"
          SFLOW_TEST_CLICKHOUSE_USER: sflow
          SFLOW_TEST_CLICKHOUSE_PASSWORD: ci-password
        run: pytest -q -p no:warnings

  frontend:
    name: Web UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [collector, api, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build every image of the stack
        env:
          CLICKHOUSE_PASSWORD: ci-password
        run: docker compose build
