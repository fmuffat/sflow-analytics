version: 2
updates:
  - { package-ecosystem: gomod, directory: /collector, schedule: { interval: weekly } }
  - { package-ecosystem: pip, directory: /api, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /frontend, schedule: { interval: weekly },
      groups: { frontend: { patterns: ["*"] } } }
  - { package-ecosystem: docker, directory: /collector, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /api, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /frontend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /nginx, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: monthly } }
