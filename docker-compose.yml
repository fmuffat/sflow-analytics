# sFlow Analytics stack: clickhouse, collector, api, frontend, nginx.
# Web UI: https://<host>/  (self-signed certificate on first start)
#
#   scripts/dev-up.sh                             # clickhouse + collector
#   scripts/dev-up.sh --test                      # + synthetic traffic generator
#   docker compose logs -f collector

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-sflow}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env (scripts/dev-up.sh generates one)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse/config.d/sflow.xml:/etc/clickhouse-server/config.d/sflow.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      # Dev only: native protocol and HTTP for tests and ad-hoc queries.
      - "127.0.0.1:9000:9000/tcp"
      - "127.0.0.1:8123:8123/tcp"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-sflow}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  collector:
    build:
      context: ./collector
      args:
        VERSION: ${APP_VERSION:-dev}
    image: sflow-analytics/collector:${APP_VERSION:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SFLOW_LISTEN_ADDRESS: ${SFLOW_LISTEN_ADDRESS:-0.0.0.0}
      SFLOW_PORT: ${SFLOW_PORT:-6343}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
    # The collector starts and receives sFlow even while ClickHouse is down;
    # rows are buffered and retried.
    depends_on:
      - clickhouse
    ports:
      - "${SFLOW_PORT:-6343}:${SFLOW_PORT:-6343}/udp"
      # Collector status endpoint, dev only. Not exposed in production.
      - "127.0.0.1:${COLLECTOR_HTTP_PORT:-8081}:8081/tcp"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    build:
      context: ./api
      target: runtime
    image: sflow-analytics/api:${APP_VERSION:-dev}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      COLLECTOR_STATUS_URL: http://collector:8081
      CONFIG_DIR: /config
    volumes:
      - app-config:/config
      - nginx-certs:/certs        # HTTPS certificate, managed from Administration
    depends_on:
      - clickhouse
      - collector
    ports:
      # Dev only; nginx will front the API in Phase 4.
      - "127.0.0.1:${API_PORT:-8000}:8000/tcp"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Background jobs (session cleanup; later DNS, SmartZone/RUCKUS One, alerts, reports).
  worker:
    image: sflow-analytics/api:${APP_VERSION:-dev}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      COLLECTOR_STATUS_URL: http://collector:8081
      CONFIG_DIR: /config
    volumes:
      - app-config:/config
    depends_on:
      - api
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: sflow-analytics/frontend:${APP_VERSION:-dev}
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    build: ./nginx
    image: sflow-analytics/nginx:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      # Names/IPs put in the self-signed certificate, e.g. IP:192.0.2.10
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-sflow-analytics}
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    volumes:
      - nginx-certs:/etc/nginx/certs
    depends_on:
      - api
      - frontend
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Synthetic sFlow from 5 fake exporters. Enabled with --profile test.
  generator:
    image: sflow-analytics/collector:${APP_VERSION:-dev}
    profiles: ["test"]
    depends_on:
      - collector
    entrypoint: ["/usr/local/bin/sflow-gen"]
    healthcheck:
      disable: true
    command:
      - -target=collector:${SFLOW_PORT:-6343}
      - -exporters=5
      - -rate=20
      - -samples=8
      - -malformed-every=500
    restart: unless-stopped

volumes:
  clickhouse-data:
  nginx-certs:
  app-config:
