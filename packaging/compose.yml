# sFlow Analytics appliance (installed by install.sh; images loaded from the package).
# Manage with:  cd /opt/sflow-analytics && sudo docker compose ps | logs -f | restart
name: ${SFLOW_PROJECT:-sflow-analytics}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-sflow}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sflow}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?missing in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/sflow.xml:/etc/clickhouse-server/config.d/sflow.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-sflow}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  collector:
    image: sflow-analytics/collector:${APP_VERSION:?missing in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      SFLOW_LISTEN_ADDRESS: 0.0.0.0
      SFLOW_PORT: "6343"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
    depends_on: [clickhouse]
    ports:
      - "${SFLOW_PORT:-6343}:6343/udp"
    logging: *logging

  api:
    image: sflow-analytics/api:${APP_VERSION}
    restart: unless-stopped
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      COLLECTOR_STATUS_URL: http://collector:8081
      CONFIG_DIR: /config
    volumes:
      - app-config:/config
      - nginx-certs:/certs        # HTTPS certificate, managed from Administration
      - ./updates:/updates        # update requests / progress, shared with the host updater
    depends_on: [clickhouse, collector]
    logging: *logging

  worker:
    image: sflow-analytics/api:${APP_VERSION}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      COLLECTOR_STATUS_URL: http://collector:8081
      CONFIG_DIR: /config
    volumes:
      - app-config:/config
    depends_on: [api]
    healthcheck:
      disable: true
    logging: *logging

  frontend:
    image: sflow-analytics/frontend:${APP_VERSION}
    restart: unless-stopped
    logging: *logging

  nginx:
    image: sflow-analytics/nginx:${APP_VERSION}
    restart: unless-stopped
    environment:
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-sflow-analytics}
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    volumes:
      - nginx-certs:/etc/nginx/certs
    depends_on: [api, frontend]
    ports:
      - "${HTTP_PORT:-80}:80/tcp"
      - "${HTTPS_PORT:-443}:443/tcp"
    logging: *logging

  # Synthetic sFlow from 5 fake switches, to try the product without a switch:
  #   sudo docker compose --profile demo up -d      (stop: sudo docker compose stop generator)
  generator:
    image: sflow-analytics/collector:${APP_VERSION}
    profiles: ["demo"]
    depends_on: [collector]
    entrypoint: ["/usr/local/bin/sflow-gen"]
    command: ["-target=collector:6343", "-exporters=5", "-rate=20", "-samples=8"]
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *logging

volumes:
  clickhouse-data:
  nginx-certs:
  app-config:
