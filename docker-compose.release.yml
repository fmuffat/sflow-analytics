# Run published images (no local build):
#
#   SFLOW_IMAGES=ghcr.io/<owner>/sflow-analytics APP_VERSION=0.5.0 \
#     docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# Everything else (volumes, ports, configuration) comes from docker-compose.yml.

services:
  collector:
    image: ${SFLOW_IMAGES:?set SFLOW_IMAGES, e.g. ghcr.io/<owner>/sflow-analytics}-collector:${APP_VERSION:?set APP_VERSION}
    build: !reset null
  api:
    image: ${SFLOW_IMAGES}-api:${APP_VERSION}
    build: !reset null
  worker:
    image: ${SFLOW_IMAGES}-api:${APP_VERSION}
  frontend:
    image: ${SFLOW_IMAGES}-frontend:${APP_VERSION}
    build: !reset null
  nginx:
    image: ${SFLOW_IMAGES}-nginx:${APP_VERSION}
    build: !reset null
  generator:
    image: ${SFLOW_IMAGES}-collector:${APP_VERSION}
